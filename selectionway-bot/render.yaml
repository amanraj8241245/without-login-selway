services:
  - type: web                  # Web Service — free tier pe available hai
    name: selectionway-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: API_ID
        sync: false            # Render dashboard mein manually set karein
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BASE_URL
        value: https://raj-selectionwayapi.onrender.com
      - key: SESSION_DIR
        value: /tmp
    # Free tier: 512 MB RAM, shared CPU
    plan: free
